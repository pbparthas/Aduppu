name = "aduppu-auth"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Public client id (baked into the app too). The SECRET is set separately with
# `wrangler secret put GOOGLE_CLIENT_SECRET` — never put it in this file.
#
# For AI recipe drafting (POST /recipe), set the Gemini free-tier key:
#   wrangler secret put GEMINI_API_KEY
# Create a free key at https://aistudio.google.com/apikey
# Without it, /recipe returns 501 and the app hides the "Draft the recipe" button.
[vars]
GOOGLE_CLIENT_ID = "934726535844-mu79uunbbckj8v67i3gb5vk619grn86o.apps.googleusercontent.com"
ALLOWED_ORIGINS = "https://aduppu.orionforge.dev,http://localhost:5173"
COOKIE_DOMAIN = "orionforge.dev"

# Session store (refresh tokens). Create it with:
#   wrangler kv namespace create SESSIONS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "c0cc4ea8d4c64894a9f4adff66564713"

# Serve it at auth.orionforge.dev. Easiest is to add a Custom Domain in the
# Cloudflare dashboard (Workers & Pages → aduppu-auth → Settings → Domains &
# Routes → Add → auth.orionforge.dev), which also creates the DNS record.
# Alternatively uncomment a route:
# routes = [{ pattern = "auth.orionforge.dev", custom_domain = true }]
